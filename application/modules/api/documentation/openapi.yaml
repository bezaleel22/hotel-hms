openapi: 3.0.0
info:
  title: Hotel Management System API
  version: 1.0.0
  description: REST API for hotel room booking and management

servers:
  - url: /api/v1
    description: API endpoint

components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Booking:
      type: object
      properties:
        booking_id:
          type: integer
          example: 123
        room_id:
          type: integer
          example: 1
        checkin:
          type: string
          format: date
          example: "2024-02-01"
        checkout:
          type: string
          format: date
          example: "2024-02-03"
        adults:
          type: integer
          example: 2
        children:
          type: integer
          example: 0
        status:
          type: string
          enum: [pending, confirmed, cancelled, completed]
          example: confirmed
        total_amount:
          type: number
          format: float
          example: 299.99
      required:
        - room_id
        - checkin
        - checkout
        - adults

paths:
  /bookings:
    post:
      tags:
        - Bookings
      summary: Create a new booking
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
      responses:
        '200':
          description: Booking created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      booking_id:
                        type: integer
                        example: 123
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '500':
          description: Server error

  /bookings/{id}:
    get:
      tags:
        - Bookings
      summary: Get booking details
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Booking details
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Booking'
        '404':
          description: Booking not found

    put:
      tags:
        - Bookings
      summary: Update booking status
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [confirmed, cancelled, completed]
                reason:
                  type: string
              required:
                - status
      responses:
        '200':
          description: Booking updated successfully
        '404':
          description: Booking not found

    delete:
      tags:
        - Bookings
      summary: Cancel booking
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Booking cancelled successfully
        '400':
          description: Already cancelled or invalid state
        '404':
          description: Booking not found